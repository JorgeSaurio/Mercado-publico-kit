name: CI
on: [push, pull_request]
# Mínimo privilegio para el GITHUB_TOKEN
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions fijadas por SHA (un tag puede moverse si el repo de la action es comprometido)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          check-latest: true
          cache: npm
      - run: npm ci
      - name: Auditoría de dependencias
        run: npm audit --audit-level=high
      - name: Firmas y procedencia de paquetes
        run: npm audit signatures
      - run: npm run build
      - run: npm test
      - name: SBOM
        run: npm sbom --sbom-format cyclonedx --omit dev > sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json
