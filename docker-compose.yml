services:
  mercado-publico:
    build: .
    ports:
      - "3001:3001"
    env_file: .env
    # environment:
      # Actívalo SOLO si hay un proxy (Nginx, Traefik, Cloud Run…) delante y el puerto 3001 no está expuesto
      # a internet. Si no, cualquiera puede falsificar X-Forwarded-For y saltarse el rate limit.
      # TRUST_PROXY: "1"
    restart: unless-stopped
